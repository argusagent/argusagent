<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="argusagent — the all-seeing code watcher">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    @keyframes blink-cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink-cursor 1.1s step-end infinite; }

    @keyframes typing { from { width: 0; } to { width: 340px; } }
    .type-clip { animation: typing 2.2s steps(11, end) 0.4s both; }

    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-1 { animation: fade-up 0.8s ease-out 2.8s both; }
    .fade-2 { animation: fade-up 0.8s ease-out 3.2s both; }

    @keyframes iris-scan { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-9px); } 60% { transform: translateX(9px); } }
    .iris { animation: iris-scan 6s ease-in-out infinite; }

    @keyframes lid-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.06); } }
    .eye-group { animation: lid-blink 6s ease-in-out infinite; transform-origin: 170px 140px; }

    @keyframes pulse-ring { 0% { r: 62; opacity: 0.5; } 100% { r: 92; opacity: 0; } }
    .ring { animation: pulse-ring 3s ease-out infinite; }
    .ring2 { animation: pulse-ring 3s ease-out 1.5s infinite; }

    @keyframes star-blink { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .s1 { animation: star-blink 3.1s ease-in-out infinite; }
    .s2 { animation: star-blink 4.3s ease-in-out 0.7s infinite; }
    .s3 { animation: star-blink 2.7s ease-in-out 1.4s infinite; }
    .s4 { animation: star-blink 3.7s ease-in-out 2.1s infinite; }
    .s5 { animation: star-blink 4.9s ease-in-out 0.3s infinite; }

    @keyframes shimmer { from { transform: translateX(-360px); } to { transform: translateX(640px); } }
    .shimmer { animation: shimmer 4s linear 3.6s infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178c6"/>
      <stop offset="0.5" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="0.55" stop-color="#3178c6"/>
      <stop offset="1" stop-color="#1b3a63"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2942" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip"><rect class="type-clip" x="330" y="82" width="340" height="64"/></clipPath>
    <clipPath id="lineClip"><rect x="330" y="160" width="360" height="4" rx="2"/></clipPath>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="13.5" fill="none" stroke="#26334f" stroke-width="1"/>

  <!-- constellation of watcher eyes -->
  <g fill="#4cc2ff">
    <circle class="s1" cx="780" cy="52" r="2.5"/>
    <circle class="s2" cx="860" cy="120" r="2"/>
    <circle class="s3" cx="920" cy="70" r="2.5"/>
    <circle class="s4" cx="830" cy="205" r="2"/>
    <circle class="s5" cx="930" cy="170" r="2.5"/>
    <circle class="s3" cx="740" cy="150" r="1.5"/>
    <circle class="s1" cx="890" cy="235" r="1.5"/>
  </g>
  <g stroke="#26334f" stroke-width="1">
    <line x1="780" y1="52" x2="860" y2="120"/>
    <line x1="860" y1="120" x2="920" y2="70"/>
    <line x1="860" y1="120" x2="930" y2="170"/>
    <line x1="830" y1="205" x2="930" y2="170"/>
    <line x1="740" y1="150" x2="860" y2="120"/>
  </g>

  <!-- the Argus eye -->
  <circle class="ring" cx="170" cy="140" r="62" stroke="#3178c6" stroke-width="1.5" fill="none"/>
  <circle class="ring2" cx="170" cy="140" r="62" stroke="#8b7bff" stroke-width="1" fill="none"/>
  <g class="eye-group">
    <path d="M 96 140 Q 170 78 244 140 Q 170 202 96 140 Z" fill="#0d1526" stroke="#3d5a85" stroke-width="2.5"/>
    <g class="iris">
      <circle cx="170" cy="140" r="34" fill="url(#irisGrad)"/>
      <circle cx="170" cy="140" r="15" fill="#0b1020"/>
      <circle cx="178" cy="131" r="6" fill="#e8f4ff" opacity="0.9"/>
      <g stroke="#4cc2ff" stroke-width="1" opacity="0.55">
        <line x1="170" y1="106" x2="170" y2="116"/>
        <line x1="170" y1="164" x2="170" y2="174"/>
        <line x1="136" y1="140" x2="146" y2="140"/>
        <line x1="194" y1="140" x2="204" y2="140"/>
        <line x1="146" y1="116" x2="153" y2="123"/>
        <line x1="187" y1="157" x2="194" y2="164"/>
        <line x1="194" y1="116" x2="187" y2="123"/>
        <line x1="153" y1="157" x2="146" y2="164"/>
      </g>
    </g>
  </g>

  <!-- name: typed, with blinking cursor -->
  <g clip-path="url(#typeClip)">
    <text class="mono" x="330" y="128" font-size="52" font-weight="700" fill="#e6edf3">argusagent</text>
  </g>
  <rect class="cursor" x="672" y="90" width="5" height="46" fill="#4cc2ff"/>

  <!-- accent underline with shimmer sweep -->
  <rect x="330" y="160" width="360" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>
  <g clip-path="url(#lineClip)">
    <rect class="shimmer" x="330" y="160" width="80" height="4" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- subtitle lines -->
  <text class="mono fade-1" x="330" y="198" font-size="19" fill="#8b949e">// the all-seeing code watcher — bugs don't get past a hundred eyes</text>
  <g class="fade-2">
    <text class="mono" x="330" y="232" font-size="17" fill="#58a6ff">const</text>
    <text class="mono" x="386" y="232" font-size="17" fill="#e6edf3">stack</text>
    <text class="mono" x="438" y="232" font-size="17" fill="#8b949e">=</text>
    <text class="mono" x="456" y="232" font-size="17" fill="#a5d6ff">["TypeScript", "Node.js", "Preact", "ESLint"]</text>
    <text class="mono" x="836" y="232" font-size="17" fill="#8b949e">;</text>
  </g>
</svg>

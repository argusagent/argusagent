name: CI

on:
  push:
    paths:
      - "packages/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/ci.yml"

jobs:
  test-eslint-plugin-argus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-plugin-argus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
